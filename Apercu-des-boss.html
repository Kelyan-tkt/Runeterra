let serial=0;
function css(){
 if(typeof document==='undefined'||document.getElementById('boss-appearances-style'))return;
 const style=document.createElement('style');style.id='boss-appearances-style';
 style.textContent=`
 .boss-art-svg{display:block;width:100%;max-width:340px;height:auto;margin:auto;overflow:visible}
 .boss-art-svg .ba-body{transform-origin:160px 180px;animation:baBreathe 3s ease-in-out infinite}
 .boss-art-svg .ba-weakpoint{stroke:#e6ffff;stroke-width:2px;transition:fill .2s,filter .2s}
 .boss-art-svg .ba-armor{opacity:0;transition:opacity .2s}
 .boss-art-svg .ba-warning-halo{opacity:0}
 .boss-art-svg .ba-strike{transform-box:fill-box;transform-origin:50% 75%}
 .hb-stage[data-phase="armor"] .boss-art-svg .ba-armor{opacity:1}
 .hb-stage[data-phase="warning"] .boss-art-svg .ba-warning-halo{opacity:1;animation:baWarn .5s ease-in-out infinite}
 .hb-stage[data-phase="warning"] .boss-art-svg .ba-strike{animation:baStrike .7s ease-in-out infinite}
 .hb-stage[data-phase="exposed"] .boss-art-svg .ba-weakpoint{fill:#ffb234!important;stroke:#fff1ad;filter:drop-shadow(0 0 12px #ffad32)}
 .hb-stage[data-phase="exposed"] .boss-art-svg .ba-body{animation:baBreathe 1s ease-in-out infinite}
 .bs-boss .boss-art-svg{width:100%;height:150px;margin-bottom:8px}
 .bs-boss .ba-body{animation:none}
 @keyframes baBreathe{50%{transform:translateY(-4px)}}
 @keyframes baWarn{50%{opacity:.25}}
 @keyframes baStrike{50%{transform:rotate(-9deg) translateY(-4px)}}
 @media(prefers-reduced-motion:reduce){.boss-art-svg .ba-body,.boss-art-svg .ba-strike,.boss-art-svg .ba-warning-halo{animation:none!important}.boss-art-svg .ba-weakpoint,.boss-art-svg .ba-armor{transition:none}}
 `;document.head.appendChild(style);
}
function bossArtwork(id){
 css();const key=Object.hasOwn(ART,id)?id:'hextech',a=ART[key],n=`ba-${++serial}`;
 const body=a.body.replaceAll('@M@',`url(#${n}-metal)`).replaceAll('@A@',a.accent);
 return `<svg class="boss-art-svg" data-boss-art="${key}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="${a.name}"><title>${a.name}</title><defs><linearGradient id="${n}-metal" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="${a.metal[0]}"/><stop offset="1" stop-color="${a.metal[1]}"/></linearGradient></defs><ellipse cx="160" cy="293" rx="109" ry="15" fill="#000" opacity=".3"/><g class="ba-warning-halo" fill="none" stroke="#ff7b76" stroke-width="4"><ellipse cx="160" cy="167" rx="140" ry="126"/></g><g class="ba-body" stroke="#111d2a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">${body}</g><g class="ba-armor" fill="none" stroke="#75cfff"><path d="M160 25L276 76L261 213L160 286L59 213L44 76Z" stroke-width="7" opacity=".65"/><path d="M160 41L261 86L247 204L160 268L73 204L59 86Z" stroke-width="2" stroke-dasharray="10 8" opacity=".7"/></g></svg>`;
}
const bossAppearanceNames=Object.fromEntries(Object.entries(ART).map(([id,a])=>[id,a.name]));

document.getElementById('gallery').innerHTML=Object.entries(bossAppearanceNames).map(([id,name])=>`<article class="hb-stage" data-phase="normal"><h2>${name}</h2>${bossArtwork(id)}</article>`).join('');
document.getElementById('controls').addEventListener('click',e=>{const b=e.target.closest('[data-phase]');if(b)document.querySelectorAll('.hb-stage').forEach(el=>el.dataset.phase=b.dataset.phase);});
</script></body></html>
